<div class="input-text">
  <label *ngIf="label">{{ label }}</label>
  <select
    class="textInputField input-field"
    [value]="value"
    [disabled]="disabled"
    (change)="onSelectChange($event)"
    (blur)="onTouched()"
  >
    <option *ngFor="let option of options" [value]="option.value">
      {{ option.label }}
    </option>
  </select>
</div>
