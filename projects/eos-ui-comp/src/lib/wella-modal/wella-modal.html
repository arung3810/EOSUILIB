<div *ngIf="open" class="modal-overlay" (click)="onBackdropClick($event)">
  <div class="wella-modal-content">
    <button class="close-button" (click)="onClose()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="modal-body">
      <h2 class="modal-title">Wella Limited</h2>
      
      <div class="perks-section">
        <h3 class="perks-title">Perks</h3>
        <ul class="perks-list">
          <li>Flexible working hours</li>
          <li>Health insurance</li>
          <li>Professional development opportunities</li>
          <li>Team building activities</li>
          <li>Remote work options</li>
        </ul>
      </div>

      <div class="offer-section">
        <p class="offer-text">
          Join our dynamic team and enjoy a comprehensive benefits package designed to support your professional growth and work-life balance.
        </p>
      </div>
    </div>
  </div>
</div>
