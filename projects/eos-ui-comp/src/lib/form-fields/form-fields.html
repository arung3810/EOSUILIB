<div class="form-field-wrapper" [class.full-width]="fullWidth" [ngClass]="sizeClass">
  <!-- Label -->
  <label *ngIf="label" class="field-label" [class.required]="required">
    {{ label }}
    <span *ngIf="required" class="required-asterisk">*</span>
  </label>

  <!-- Text Input -->
  <div *ngIf="type === 'text' || type === 'email' || type === 'number'" class="input-wrapper">
    <span *ngIf="prefix" class="input-prefix">{{ prefix }}</span>
    <input
      [type]="type"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [required]="required"
      [value]="value"
      (input)="onInputChange($event)"
      (blur)="onBlur($event)"
      (focus)="onFocus($event)"
      class="form-input"
      [class.has-prefix]="prefix"
      [class.has-suffix]="suffix"
      [class.error]="hasError"
      [class.focused]="isFocused"
    />
    <span *ngIf="suffix" class="input-suffix">{{ suffix }}</span>
  </div>

  <!-- Textarea -->
  <textarea
    *ngIf="type === 'textarea'"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [required]="required"
    [rows]="rows"
    [value]="value"
    (input)="onInputChange($event)"
    (blur)="onBlur($event)"
    (focus)="onFocus($event)"
    class="form-textarea"
    [class.error]="hasError"
    [class.focused]="isFocused"
  ></textarea>

  <!-- Date Input -->
  <input
    *ngIf="type === 'date'"
    type="date"
    [disabled]="disabled"
    [required]="required"
    [value]="value"
    (input)="onInputChange($event)"
    (blur)="onBlur($event)"
    (focus)="onFocus($event)"
    class="form-input"
    [class.error]="hasError"
    [class.focused]="isFocused"
  />

  <!-- Select Dropdown -->
  <select
    *ngIf="type === 'select'"
    [disabled]="disabled"
    [required]="required"
    [value]="value"
    (change)="onInputChange($event)"
    (blur)="onBlur($event)"
    (focus)="onFocus($event)"
    class="form-select"
    [class.error]="hasError"
    [class.focused]="isFocused"
  >
    <option value="" disabled selected>{{ placeholder || 'Select an option' }}</option>
    <option *ngFor="let option of options" [value]="option.value">
      {{ option.label }}
    </option>
  </select>

  <!-- Toggle Switch -->
  <div *ngIf="type === 'toggle'" class="toggle-wrapper">
    <label class="toggle-switch">
      <input
        type="checkbox"
        [disabled]="disabled"
        [checked]="value"
        (change)="onToggleChange($event)"
        class="toggle-input"
      />
      <span class="toggle-slider"></span>
    </label>
    <span *ngIf="toggleLabel" class="toggle-label-text">{{ toggleLabel }}</span>
  </div>

  <!-- Radio Buttons -->
  <div *ngIf="type === 'radio'" class="radio-group">
    <label *ngFor="let option of radioOptions" class="radio-label">
      <input
        type="radio"
        [name]="label"
        [value]="option.value"
        [checked]="value === option.value"
        [disabled]="disabled"
        (change)="onInputChange(option.value)"
        class="radio-input"
      />
      <span class="radio-text">{{ option.label }}</span>
    </label>
  </div>

  <!-- Checkbox -->
  <div *ngIf="type === 'checkbox'" class="checkbox-wrapper">
    <label class="checkbox-label">
      <input
        type="checkbox"
        [disabled]="disabled"
        [checked]="value"
        (change)="onToggleChange($event)"
        class="checkbox-input"
      />
      <span class="checkbox-text">{{ checkboxLabel }}</span>
    </label>
  </div>

  <!-- Helper Text -->
  <span *ngIf="helperText && !hasError" class="helper-text">{{ helperText }}</span>

  <!-- Error Message -->
  <span *ngIf="hasError" class="error-text">{{ errorMessage }}</span>
</div>
